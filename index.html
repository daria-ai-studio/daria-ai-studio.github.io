<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daria AI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800&display=swap&subset=cyrillic,latin-ext" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  body { margin: 0; font-family: "Inter", Arial, sans-serif; background: #1e1b4b; color: #f8fafc; text-align: center; }
  nav { position: absolute; top: 14px; right: 16px; z-index: 10; text-align: left; }
  #lang-toggle { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid #38bdf8; background: rgba(15,23,42,0.6); color: #f8fafc; border-radius: 20px; cursor: pointer; font-weight: 600; }
  #lang-toggle:hover { border-color: #a855f7; }
  .lang-list { display: none; position: absolute; right: 0; top: calc(100% + 8px); min-width: 160px; padding: 6px; background: #1b1745; border: 1px solid rgba(168,85,247,0.5); border-radius: 14px; box-shadow: 0 12px 30px rgba(0,0,0,0.4); }
  nav.open .lang-list { display: block; }
  .lang-list button { display: block; width: 100%; padding: 9px 12px; border: none; background: none; color: #f8fafc; border-radius: 10px; cursor: pointer; text-align: left; font-size: 15px; }
  .lang-list button:hover { background: rgba(56,189,248,0.15); }
  .lang-list button.active { background: #38bdf8; color: #0f172a; }
  main { box-sizing: border-box; width: calc(100% - 32px); max-width: 820px; margin: 20px auto; padding: 90px 24px; border-radius: 28px; background: radial-gradient(circle at 15% 20%, rgba(56,189,248,0.35), transparent 55%), radial-gradient(circle at 85% 85%, rgba(168,85,247,0.5), transparent 55%), #1b1745; box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
  h1 { background: linear-gradient(90deg, #f8fafc, #c4b5fd, #38bdf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { font-size: 40px; margin-bottom: 10px; }
  h1, h2, h3 { font-family: "Montserrat", Arial, sans-serif; font-weight: 800; letter-spacing: -0.5px; }
  button { font-family: inherit; }
  h2 { font-size: 28px; }
  p { font-size: 20px; line-height: 1.5; color: #cbd5e1; }
  .btn { display: inline-block; margin-top: 24px; padding: 14px 28px; background: #38bdf8; color: #0f172a; border-radius: 30px; text-decoration: none; font-weight: bold; }
  #contact { padding: 40px 20px 80px; max-width: 700px; margin: auto; }
  .contacts { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .contacts a { padding: 12px 22px; border: 1px solid #38bdf8; border-radius: 30px; color: #f8fafc; text-decoration: none; }
  .contacts a:hover { background: #38bdf8; color: #0f172a; }
  .lead-intro { font-size: 18px; margin: 8px 0 0; }
  .lead-form { display: grid; gap: 14px; text-align: left; margin: 20px auto 28px; max-width: 520px; padding: 24px; background: #111c33; border: 1px solid #1e293b; border-radius: 20px; }
  .lead-form label { display: grid; gap: 6px; font-size: 15px; color: #cbd5e1; }
  .lead-form input, .lead-form textarea { font: inherit; font-size: 16px; color: #f8fafc; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px 14px; }
  .lead-form input:focus, .lead-form textarea:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.25); }
  .lead-form textarea { resize: vertical; min-height: 110px; }
  .lead-form .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.4; }
  .lead-form .consent input { width: 18px; height: 18px; margin: 2px 0 0; padding: 0; flex: none; accent-color: #38bdf8; }
  .lead-form a { color: #38bdf8; }
  .lead-form .btn { margin-top: 4px; border: none; cursor: pointer; font-size: 16px; justify-self: center; }
  .lead-form .btn:disabled { opacity: 0.6; cursor: wait; }
  #f-status { font-size: 16px; margin: 0; text-align: center; }
  #f-status:empty { display: none; }
  #f-status.ok { color: #86efac; }
  #f-status.err { color: #fca5a5; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  footer { padding: 8px 16px 40px; font-size: 14px; color: #94a3b8; }
  footer a { color: #cbd5e1; }
  #services, #about, #portfolio { padding: 40px 20px; max-width: 900px; margin: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; text-align: left; }
  .card { border: 1px solid #1e293b; background: #111c33; border-radius: 16px; padding: 20px; }
  .card h3 { margin: 0 0 8px; color: #38bdf8; }
  .card .icon { font-size: 34px; margin-bottom: 10px; }
  .card { transition: transform 0.25s, border-color 0.25s; }
  .card:hover { transform: translateY(-4px); border-color: #a855f7; }
  .anim .reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .anim .reveal.visible { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .anim .reveal { opacity: 1; transform: none; transition: none; } }
  .card p { font-size: 16px; margin: 0; }
  .menu { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 24px 110px 8px; }
  @media (max-width: 600px) { .menu { padding: 70px 16px 8px; } }
  .menu a { color: #cbd5e1; text-decoration: none; }
  .menu a::before { margin-right: 6px; }
  .menu a:hover { color: #38bdf8; }
  #m-services::before { content: "✨"; }
  #m-about::before { content: "👩‍💻"; }
  #m-portfolio::before { content: "🎬"; }
  #m-contact::before { content: "✉️"; }
  .logo { display: block; width: 120px; height: 120px; margin: 0 auto 8px; filter: drop-shadow(0 10px 30px rgba(168,85,247,0.45)); }
  .avatar { width: 170px; height: 170px; border-radius: 50%; object-fit: cover; border: 4px solid transparent; background: linear-gradient(#1e1b4b, #1e1b4b) padding-box, linear-gradient(135deg, #38bdf8, #a855f7) border-box; }
</style>
</head>
<body>
<nav>
  <button id="lang-toggle" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg><span id="lang-current">PL</span> ▾</button>
  <div class="lang-list">
    <button data-lang="pl">PL · Polski</button>
    <button data-lang="ru">RU · Русский</button>
    <button data-lang="ua">UA · Українська</button>
    <button data-lang="en">EN · English</button>
  </div>
</nav>
<div class="menu">
  <a href="#services" id="m-services"></a>
  <a href="#about" id="m-about"></a>
  <a href="#portfolio" id="m-portfolio"></a>
  <a href="#contact" id="m-contact"></a>
</div>
<main>
  <h1>Daria AI Studio</h1>
  <p id="text"></p>
  <a class="btn" id="cta" href="#contact"></a>
</main>
<section id="services">
  <h2 id="services-title"></h2>
  <div class="grid">
    <div class="card"><div class="icon">🌐</div><h3 id="s1-t"></h3><p id="s1-p"></p></div>
    <div class="card"><div class="icon">🤖</div><h3 id="s2-t"></h3><p id="s2-p"></p></div>
    <div class="card"><div class="icon">💬</div><h3 id="s3-t"></h3><p id="s3-p"></p></div>
    <div class="card"><div class="icon">🎬</div><h3 id="s4-t"></h3><p id="s4-p"></p></div>
  </div>
</section>
<section id="about">
  <img class="logo avatar" src="avatar.jpg" alt="Daria AI Studio" width="170" height="170">
  <h2 id="about-title"></h2>
  <p id="about-text"></p>
</section>
<section id="portfolio">
  <h2 id="portfolio-title"></h2>
  <p id="portfolio-text"></p>
</section>
<section id="contact">
  <h2 id="contact-title"></h2>
  <p class="lead-intro" id="f-intro"></p>
  <form id="lead-form" class="lead-form">
    <label class="hp" aria-hidden="true">Website<input type="text" name="_honey" tabindex="-1" autocomplete="off"></label>
    <label><span id="f-name-l"></span><input type="text" name="name" required maxlength="100" autocomplete="name"></label>
    <label><span id="f-contact-l"></span><input type="text" name="contact" required maxlength="150" autocomplete="email"></label>
    <label><span id="f-msg-l"></span><textarea name="message" rows="5" required maxlength="2000"></textarea></label>
    <label class="consent"><input type="checkbox" name="consent" required><span><span id="f-consent-l"></span> <a id="f-privacy-link" href="privacy.html" target="_blank" rel="noopener"></a></span></label>
    <button type="submit" class="btn" id="f-send"></button>
    <p id="f-status" role="status" aria-live="polite"></p>
  </form>
  <div class="contacts">
    <a id="c-email">Email</a>
    <a id="c-telegram" target="_blank">Telegram</a>
    <a id="c-whatsapp" target="_blank">WhatsApp</a>
    <a id="c-phone"></a>
  </div>
</section>
<footer>© 2026 Daria AI Studio · <a id="footer-privacy" href="privacy.html"></a></footer>
<script>
// ===== КОНТАКТЫ: впишите данные между кавычками. Пустая строка = кнопка скрыта =====
const contacts = {
  email: "sandi1991@op.pl",
  telegram: "",   // позже: username Telegram-бота без @
  phone: ""       // номер с кодом страны, только цифры, например: "48500100200" (для WhatsApp и звонка)
};
// ======================================================================================

const sections = {
  pl: ["Usługi", "Moje prace", "Kontakt", "Strony internetowe", "Nowoczesne strony w kilku językach, wygodne na telefonie.", "Asystenci AI", "Inteligentny pomocnik, który odpowiada klientom 24/7.", "Boty Telegram i automatyzacja", "Zapisy, zamówienia i powiadomienia bez ręcznej pracy.", "Pierwsze projekty pojawią się tu już wkrótce.", "Filmy reklamowe", "Filmy o produkcie, usłudze lub firmie do TikToka, Instagrama, Facebooka i YouTube — pionowe i poziome.", "O mnie", "Nazywam się Daria. Mieszkam w Polsce i pracuję online — z klientami z całej Polski i z zagranicy. Tworzę strony internetowe, filmy reklamowe i asystentów AI, które pomagają firmom przyciągać klientów i oszczędzać czas. Mówię po polsku, rosyjsku i ukraińsku, a wszystko tłumaczę prostymi słowami."],
  ru: ["Услуги", "Мои работы", "Контакты", "Сайты", "Современные сайты на нескольких языках, удобные на телефоне.", "AI-помощники", "Умный помощник, который отвечает клиентам 24/7.", "Telegram-боты и автоматизация", "Запись, заказы и уведомления без ручной работы.", "Первые проекты скоро появятся здесь.", "Рекламные ролики", "Ролики о товаре, услуге или компании для TikTok, Instagram, Facebook и YouTube — вертикальные и горизонтальные.", "Обо мне", "Меня зовут Дарья. Я живу в Польше и работаю онлайн — с клиентами по всей Польше и за её пределами. Создаю сайты, рекламные ролики и AI-помощников, которые помогают бизнесу привлекать клиентов и экономить время. Говорю на польском, русском и украинском и объясняю всё простыми словами."],
  ua: ["Послуги", "Мої роботи", "Контакти", "Сайти", "Сучасні сайти кількома мовами, зручні на телефоні.", "AI-помічники", "Розумний помічник, який відповідає клієнтам 24/7.", "Telegram-боти та автоматизація", "Запис, замовлення та сповіщення без ручної роботи.", "Перші проєкти незабаром з'являться тут.", "Рекламні ролики", "Ролики про товар, послугу чи компанію для TikTok, Instagram, Facebook і YouTube — вертикальні та горизонтальні.", "Про мене", "Мене звати Дар'я. Я живу в Польщі та працюю онлайн — з клієнтами по всій Польщі й за її межами. Створюю сайти, рекламні ролики та AI-помічників, які допомагають бізнесу залучати клієнтів і заощаджувати час. Розмовляю польською, російською та українською і пояснюю все простими словами."],
  en: ["Services", "My work", "Contact", "Websites", "Modern multilingual websites that work great on phones.", "AI assistants", "A smart helper that answers your clients 24/7.", "Telegram bots & automation", "Bookings, orders and notifications without manual work.", "First projects coming soon.", "Video ads", "Videos about your product, service or company for TikTok, Instagram, Facebook and YouTube — vertical and horizontal.", "About me", "My name is Daria. I live in Poland and work online with clients across Poland and beyond. I create websites, video ads and AI assistants that help businesses attract customers and save time. I speak Polish, Russian and Ukrainian, and I explain everything in plain words."]
};
const sectionIds = ["services-title", "portfolio-title", null, "s1-t", "s1-p", "s2-t", "s2-p", "s3-t", "s3-p", "portfolio-text", "s4-t", "s4-p", "about-title", "about-text"];

const texts = {
  pl: ["Tworzę strony internetowe, asystentów AI, chatboty i filmy reklamowe dla Twojej firmy.", "Napisz do mnie", "Kontakt", "Zadzwoń"],
  ru: ["Создаю сайты, AI-помощников, чат-ботов и рекламные ролики для вашего бизнеса.", "Написать мне", "Контакты", "Позвонить"],
  ua: ["Створюю сайти, AI-помічників, чат-ботів і рекламні ролики для вашого бізнесу.", "Написати мені", "Контакти", "Зателефонувати"],
  en: ["I create websites, AI assistants, chatbots and video ads for your business.", "Contact me", "Contact", "Call me"]
};

// Тексты формы заявки: [подсказка, имя, контакт, вопрос, согласие, ссылка, отправить, отправка, успех, ошибка]
const formTexts = {
  pl: ["Zostaw imię i pytanie, a odezwę się do Ciebie.", "Imię", "E-mail lub telefon", "Twoje pytanie", "Wyrażam zgodę na przetwarzanie moich danych w celu odpowiedzi na zapytanie. Szczegóły:", "Polityka prywatności", "Wyślij", "Wysyłanie…", "Dziękuję! Wiadomość została wysłana. Odpowiem najszybciej, jak to możliwe.", "Nie udało się wysłać. Spróbuj ponownie albo napisz na e-mail."],
  ru: ["Оставьте имя и вопрос, и я с вами свяжусь.", "Имя", "Email или телефон", "Ваш вопрос", "Я даю согласие на обработку моих данных для ответа на заявку. Подробнее:", "Политика конфиденциальности", "Отправить", "Отправка…", "Спасибо! Сообщение отправлено. Я отвечу как можно скорее.", "Не удалось отправить. Попробуйте ещё раз или напишите на email."],
  ua: ["Залиште ім'я та питання, і я з вами зв'яжуся.", "Ім'я", "Email або телефон", "Ваше питання", "Я даю згоду на обробку моїх даних для відповіді на запит. Детальніше:", "Політика конфіденційності", "Надіслати", "Надсилання…", "Дякую! Повідомлення надіслано. Я відповім якнайшвидше.", "Не вдалося надіслати. Спробуйте ще раз або напишіть на email."],
  en: ["Leave your name and question, and I will get back to you.", "Name", "Email or phone", "Your question", "I agree to the processing of my data to reply to my request. Details:", "Privacy policy", "Send", "Sending…", "Thank you! Your message has been sent. I will reply as soon as possible.", "Sending failed. Please try again or email me."]
};
let currentLang = "pl";

function setupForm() {
  const form = document.getElementById("lead-form");
  const status = document.getElementById("f-status");
  const send = document.getElementById("f-send");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const t = formTexts[currentLang];
    const d = new FormData(form);
    if (d.get("_honey")) return;
    send.disabled = true;
    send.textContent = t[7];
    status.className = "";
    status.textContent = "";
    fetch("https://formsubmit.co/ajax/" + contacts.email, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        "Imię / Имя": d.get("name"),
        "Kontakt": d.get("contact"),
        "Wiadomość / Сообщение": d.get("message"),
        "Język strony": currentLang.toUpperCase(),
        _subject: "Nowe zapytanie ze strony Daria AI Studio",
        _template: "table",
        _captcha: "false"
      })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (String(res.success) !== "true") throw new Error(res.message || "error");
      status.className = "ok";
      status.textContent = formTexts[currentLang][8];
      form.reset();
    }).catch(function () {
      status.className = "err";
      status.textContent = formTexts[currentLang][9];
    }).finally(function () {
      send.disabled = false;
      send.textContent = formTexts[currentLang][6];
    });
  });
}

function setupContacts() {
  const email = document.getElementById("c-email");
  const telegram = document.getElementById("c-telegram");
  const whatsapp = document.getElementById("c-whatsapp");
  const phone = document.getElementById("c-phone");
  if (contacts.email) { email.href = "mailto:" + contacts.email; } else { email.hidden = true; }
  if (contacts.telegram) { telegram.href = "https://t.me/" + contacts.telegram; } else { telegram.hidden = true; }
  if (contacts.phone) {
    whatsapp.href = "https://wa.me/" + contacts.phone;
    phone.href = "tel:+" + contacts.phone;
  } else {
    whatsapp.hidden = true;
    phone.hidden = true;
  }
}

function setLang(lang) {
  document.getElementById("text").textContent = texts[lang][0];
  document.getElementById("cta").textContent = texts[lang][1];
  document.getElementById("contact-title").textContent = texts[lang][2];
  document.getElementById("c-phone").textContent = texts[lang][3];
  sectionIds.forEach(function (id, i) { if (id) document.getElementById(id).textContent = sections[lang][i]; });
  document.getElementById("m-services").textContent = sections[lang][0];
  document.getElementById("m-portfolio").textContent = sections[lang][1];
  document.getElementById("m-contact").textContent = sections[lang][2];
  document.getElementById("m-about").textContent = sections[lang][12];
  currentLang = lang;
  const f = formTexts[lang];
  ["f-intro", "f-name-l", "f-contact-l", "f-msg-l", "f-consent-l", "f-privacy-link", "f-send"].forEach(function (id, i) {
    document.getElementById(id).textContent = f[i];
  });
  document.getElementById("footer-privacy").textContent = f[5];
  document.getElementById("footer-privacy").href = "privacy.html?lang=" + lang;
  document.getElementById("f-privacy-link").href = "privacy.html?lang=" + lang;
  document.documentElement.lang = lang;
  document.getElementById("lang-current").textContent = lang.toUpperCase();
  document.querySelectorAll("nav button[data-lang]").forEach(function (b) {
    b.classList.toggle("active", b.dataset.lang === lang);
  });
}

// Меню языков: открыть/закрыть по нажатию на значок
const langNav = document.querySelector("nav");
const langToggle = document.getElementById("lang-toggle");
function closeLang() { langNav.classList.remove("open"); langToggle.setAttribute("aria-expanded", "false"); }
langToggle.addEventListener("click", function (e) {
  e.stopPropagation();
  const open = langNav.classList.toggle("open");
  langToggle.setAttribute("aria-expanded", open ? "true" : "false");
});
document.addEventListener("click", function (e) { if (!langNav.contains(e.target)) closeLang(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeLang(); });
document.querySelectorAll("nav button[data-lang]").forEach(function (b) {
  b.addEventListener("click", function () { setLang(b.dataset.lang); closeLang(); });
});
setupContacts();
setupForm();
setLang("pl");

// Плавное появление блоков при прокрутке
if ("IntersectionObserver" in window) {
  document.documentElement.classList.add("anim");
  const items = document.querySelectorAll("main, section h2, .card, #about p, #portfolio p, .contacts, .logo");
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); }
    });
  }, { threshold: 0.15 });
  items.forEach(function (el, i) {
    el.classList.add("reveal");
    el.style.transitionDelay = (el.classList.contains("card") ? (i % 4) * 0.12 : 0) + "s";
    io.observe(el);
  });
}
</script>
</body>
</html>
